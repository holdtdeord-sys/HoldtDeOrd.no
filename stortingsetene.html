  <div class="max-w-7xl mx-auto px-6 py-12">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-3">Stortingsetene</h1>
      <p class="text-2xl text-slate-600">Hvilke løfter stemte vi egentlig på?</p>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-4 justify-center mb-10">
      <button onclick="filterAll()" class="filter-btn active px-6 py-3 rounded-2xl bg-blue-600 text-white">Alle</button>
      <button onclick="filterCategory('økonomi')" class="filter-btn px-6 py-3 rounded-2xl hover:bg-amber-100">Økonomi</button>
      <button onclick="filterCategory('helse')" class="filter-btn px-6 py-3 rounded-2xl hover:bg-red-100">Helse</button>
      <button onclick="filterCategory('klima')" class="filter-btn px-6 py-3 rounded-2xl hover:bg-emerald-100">Klima</button>
      <button onclick="filterCategory('forsvar')" class="filter-btn px-6 py-3 rounded-2xl hover:bg-slate-100">Forsvar</button>
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="politicians-grid">
      <!-- Populated by JS -->
    </div>
  </div>

  <script>
    const politicians = [
      {
        name: "Jonas Gahr Støre",
        party: "Ap",
        role: "Statsminister",
        date: "2025-09-15",
        category: "økonomi",
        promise: "Trygg styring av norsk økonomi, billigere barnehage og gratis SFO, kortere ventetider i helsevesenet",
        status: "Påbegynt"
      },
      {
        name: "Erna Solberg",
        party: "H",
        role: "Tidligere statsminister",
        date: "2025-09-10",
        category: "økonomi",
        promise: "Lavere skatter, bedre eldreomsorg og et sterkere forsvar",
        status: "Opposisjon"
      },
      {
        name: "Sylvi Listhaug",
        party: "Frp",
        role: "Partileder",
        date: "2025-09-12",
        category: "helse",
        promise: "Kortere ventetider, strengere innvandring og lavere avgifter",
        status: "Opposisjon"
      },
      {
        name: "Kirsti Bergstø",
        party: "SV",
        role: "Partileder",
        date: "2025-09-08",
        category: "klima",
        promise: "Raskere grønn omstilling, rettferdig fordeling og sterk velferd",
        status: "Opposisjon"
      }
      // Add more as needed
    ];

    function renderPoliticians(list) {
      const grid = document.getElementById('politicians-grid');
      grid.innerHTML = '';

      list.sort((a, b) => new Date(b.date) - new Date(a.date)); // Newest first

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = `bg-white rounded-3xl p-8 hover:shadow-xl transition-all border border-slate-100`;
        card.innerHTML = `
          <div class="flex gap-4">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-2xl flex items-center justify-center text-5xl">👤</div>
            <div class="flex-1">
              <div class="flex justify-between">
                <span class="px-4 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-700">${p.party}</span>
                <span class="text-sm text-slate-500">${p.date}</span>
              </div>
              <h3 class="text-2xl font-semibold mt-4">${p.name}</h3>
              <p class="text-slate-500">${p.role}</p>
              <div class="mt-6 bg-slate-50 p-5 rounded-2xl">
                <p class="italic text-slate-700">"${p.promise}"</p>
              </div>
              <div class="mt-6 flex justify-between items-center">
                <span class="text-sm font-medium text-green-600">${p.status}</span>
                <a href="#" class="text-blue-600 hover:underline text-sm">Se alle løfter →</a>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Initial render
    renderPoliticians(politicians);

    function filterAll() {
      renderPoliticians(politicians);
    }

    function filterCategory(cat) {
      const filtered = politicians.filter(p => p.category === cat);
      renderPoliticians(filtered);
    }
  </script>
</body>
