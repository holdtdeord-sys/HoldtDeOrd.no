<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokumenter - HoldtDeOrd.no</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-slate-50">

  <!-- NAV -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-700 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">H</div>
        <h1 class="text-2xl font-semibold">HoldtDeOrd.no</h1>
      </div>
      <div class="flex gap-8 text-lg font-medium">
        <a href="../../index.html" class="hover:text-blue-600">Hjem</a>
        <a href="../../saker.html" class="hover:text-blue-600">Saker</a>
        <a href="../../om-oss.html" class="hover:text-blue-600">Om oss</a>
        <a href="#" class="hover:text-blue-600 font-semibold">Dokumenter</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold mb-2">Dokumenter</h1>
    <p class="text-slate-600 mb-8">Faktabasert gjennomgang av politiske forslag og dokumenter</p>

    <!-- Enhanced Search Bar -->
    <div class="relative mb-10 group">
      <input 
        type="text" 
        id="search-input"
        placeholder="Søk etter tittel eller nøkkelord..." 
        class="w-full px-6 py-4 pl-12 bg-white border border-slate-200 rounded-3xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 text-lg transition-all">
      <i id="search-icon" 
         class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 text-xl transition-all group-focus-within:text-blue-500 group-focus-within:scale-110"></i>
    </div>

    <div class="space-y-8" id="documents-list">
      <!-- Your document cards go here -->
    </div>
  </main>

 <script>
  // Calculate relevance score (higher = better match)
  function getRelevanceScore(text, term) {
    if (!term) return 100;
    const textLower = text.toLowerCase();
    const termLower = term.toLowerCase();
    
    if (textLower === termLower) return 100;                    // Exact match
    if (textLower.includes(termLower)) return 80;               // Contains full term
    if (termLower.includes(textLower)) return 70;
    
    let score = 0;
    let termIndex = 0;
    
    for (let i = 0; i < textLower.length && termIndex < termLower.length; i++) {
      if (textLower[i] === termLower[termIndex]) {
        score += 10;
        termIndex++;
      }
    }
    
    return score + (termIndex / termLower.length) * 30;         // Bonus for completing the term
  }

  const searchInput = document.getElementById('search-input');
  const cardsContainer = document.getElementById('documents-list');
  let cards = Array.from(cardsContainer.querySelectorAll('> div'));

  searchInput.addEventListener('input', () => {
    const term = searchInput.value.trim().toLowerCase();
    
    // Add score to each card and sort
    const scoredCards = cards.map(card => {
      const title = card.querySelector('h3').textContent;
      const description = card.querySelector('p').textContent;
      
      const titleScore = getRelevanceScore(title, term);
      const descScore = getRelevanceScore(description, term);
      const totalScore = Math.max(titleScore, descScore);
      
      return { card, score: totalScore };
    });

    // Sort by score (highest first)
    scoredCards.sort((a, b) => b.score - a.score);

    // Re-append cards in sorted order
    scoredCards.forEach(({ card, score }) => {
      card.style.display = score > 15 ? 'block' : 'none';   // Hide very poor matches
      cardsContainer.appendChild(card);                     // Reorder
    });
  });
</script>
</body>
</html>
