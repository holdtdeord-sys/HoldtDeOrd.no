<head>
  <meta charset="UTF-8">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-slate-50">

  <!-- NAV -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-700 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">H</div>
        <h1 class="text-2xl font-semibold">HoldtDeOrd.no</h1>
      </div>
      <div class="flex gap-8 text-lg font-medium">
        <a href="../../index.html" class="hover:text-blue-600">Hjem</a>
        <a href="../../saker.html" class="hover:text-blue-600">Saker</a>
        <a href="../../om-oss.html" class="hover:text-blue-600">Om oss</a>
        <a href="#" class="hover:text-blue-600 font-semibold">Dokumenter</a>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-4xl font-bold mb-2">Dokumenter</h1>
    <p class="text-slate-600 mb-8">Faktabasert gjennomgang av politiske forslag og dokumenter</p>

    <!-- Search Bar -->
    <div class="relative mb-10">
      <input 
        type="text" 
        id="search-input"
        placeholder="Søk etter tittel eller nøkkelord..." 
        class="w-full px-6 py-4 pl-12 bg-white border border-slate-200 rounded-3xl focus:outline-none focus:border-blue-500 text-lg">
      <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
    </div>

    <div class="space-y-8" id="documents-list">
      <!-- Your cards go here -->
    </div>
  </main>

  <script>
    const searchInput = document.getElementById('search-input');
    const cards = document.querySelectorAll('#documents-list > div');

    searchInput.addEventListener('input', () => {
      const term = searchInput.value.toLowerCase().trim();

      cards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        const description = card.querySelector('p').textContent.toLowerCase();
        
        if (title.includes(term) || description.includes(term)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });
