<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saker - HoldtDeOrd.no</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    html {
      scroll-behavior: smooth;
    }

    #bg-particles {
      opacity: 0.25;
      mix-blend-mode: screen;
      z-index: -1;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .nav-link {
      position: relative;
      padding-bottom: 4px;
    }
    .nav-link:after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      bottom: 0;
      left: 0;
      background-color: #2563eb;
      transition: width 0.3s ease;
    }
    .nav-link:hover:after,
    .nav-link.active:after {
      width: 100%;
    }
  </style>
</head>
<body class="bg-slate-950 relative min-h-screen overflow-x-hidden">

  <!-- Fixed Particle Background -->
  <canvas id="bg-particles" class="fixed inset-0 pointer-events-none hidden lg:block"></canvas>

  <!-- NAV -->
  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-blue-700 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">H</div>
          <h1 class="text-2xl font-semibold">HoldtDeOrd.no</h1>
        </div>

        <!-- Desktop Menu -->
        <div class="hidden md:flex gap-8 text-lg font-medium items-center">
          <a href="../index.html" class="nav-link hover:text-blue-600 transition-colors">Hjem</a>
          <a href="../saker.html" class="nav-link hover:text-blue-600 transition-colors active">Saker</a>
          <a href="../stortingsetene.html" class="nav-link hover:text-blue-600 transition-colors">Stortingsetene</a>
          <a href="../partilofter.html" class="nav-link hover:text-blue-600 transition-colors">Partiløfter</a>
          <a href="dokumenter/" class="nav-link hover:text-blue-600 transition-colors">Dokumenter</a>
          <a href="../om-oss.html" class="nav-link hover:text-blue-600 transition-colors">Om oss</a>
        </div>

        <!-- Mobile Hamburger -->
        <button id="mobile-menu-button" class="md:hidden text-3xl text-slate-700 hover:text-blue-600 transition-colors">☰</button>
      </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden fixed inset-0 bg-white z-50 pt-20 px-6 overflow-auto">
      <div class="flex flex-col gap-6 text-xl font-medium">
        <a href="../index.html" class="nav-link py-3 border-b">Hjem</a>
        <a href="../saker.html" class="nav-link py-3 border-b active">Saker</a>
        <a href="../stortingsetene.html" class="nav-link py-3 border-b">Stortingsetene</a>
        <a href="../partilofter.html" class="nav-link py-3 border-b">Partiløfter</a>
        <a href="dokumenter/" class="nav-link py-3 border-b">Dokumenter</a>
        <a href="../om-oss.html" class="nav-link py-3">Om oss</a>
      </div>
      <button id="close-mobile-menu" class="absolute top-6 right-6 text-4xl text-slate-400 hover:text-slate-600">✕</button>
    </div>
  </nav>

  <!-- Main Content -->
  <section class="py-20 relative z-10">
    <div class="max-w-6xl mx-auto px-6">
      <div class="content-box rounded-3xl p-10 md:p-16">
        <h1 class="text-4xl md:text-5xl font-semibold text-center mb-6">Alle saker</h1>
        <p class="text-center text-slate-600 mb-12 max-w-2xl mx-auto">
          Faktabasert oversikt over hva politikerne sa – og hva de gjorde
        </p>
        
        <div id="saker-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Your cards go here -->
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-white border-t py-12 mt-20 relative z-10">
    <div class="max-w-6xl mx-auto px-6 text-center text-slate-500">
      <p>&copy; 2026 HoldtDeOrd.no — Faktabasert politikkoversikt</p>
    </div>
  </footer>

  <!-- Particle + Mobile Menu Script -->
  <script>
    // Particle Background
    const canvas = document.getElementById('bg-particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.2 + 0.5;
        this.speedY = Math.random() * 0.8 + 0.3;
      }
      update() {
        this.y += this.speedY;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = 'rgba(147, 197, 253, 0.65)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 95; i++) particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    initParticles();
    animate();

    // Mobile Menu
    const menuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const closeButton = document.getElementById('close-mobile-menu');

    if (menuButton && mobileMenu && closeButton) {
      menuButton.addEventListener('click', () => mobileMenu.classList.remove('hidden'));
      closeButton.addEventListener('click', () => mobileMenu.classList.add('hidden'));
    }
  </script>

</body>
</html>
