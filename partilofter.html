<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løftetreet - HoldtDeOrd.no</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .tree-container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .tree-node {
      transition: all 0.4s ease;
    }
    .tree-node:hover {
      transform: scale(1.08);
      filter: brightness(1.1);
    }
    .root { background: #166534; }
    .trunk { background: #854d0e; }
    .branch { background: #1e40af; }
    .leaf { background: #15803d; }
  </style>
</head>
<body class="bg-slate-50">

  <!-- Your current nav here -->

  <section class="py-20 bg-gradient-to-b from-slate-950 to-blue-950 text-white">
    <div class="max-w-6xl mx-auto px-6">
      <h1 class="text-5xl font-bold text-center mb-4">Løftetreet</h1>
      <p class="text-center text-blue-300 text-xl mb-16">Fra rot til krone — hva ble egentlig oppfylt?</p>

      <div class="tree-container">
        <div class="flex flex-col items-center gap-8">
          
          <!-- Roots -->
          <div class="grid grid-cols-3 gap-6 w-full max-w-2xl">
            <div class="tree-node root text-white p-6 rounded-3xl text-center cursor-pointer">
              <p class="text-sm opacity-75">Lokallag &amp; Velgere</p>
              <p class="font-semibold">Grasrotløfter</p>
            </div>
            <!-- more roots -->
          </div>

          <!-- Trunk -->
          <div class="tree-node trunk w-96 h-40 rounded-3xl flex items-center justify-center text-center p-8 shadow-2xl">
            <div>
              <p class="text-sm opacity-75">Partiprogram 2025–2029</p>
              <p class="text-2xl font-bold">Sentralt Løfte</p>
            </div>
          </div>

          <!-- Branches -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-5xl">
            <div class="tree-node branch text-white p-8 rounded-3xl">
              <div class="flex justify-between mb-4">
                <span class="text-emerald-400">● Oppfylt</span>
                <span class="text-amber-400">● Delvis</span>
              </div>
              <h3 class="font-semibold mb-2">Skattelette for middelklassen</h3>
              <p class="text-sm opacity-80">Lovet 12 mrd — levert 4,8 mrd</p>
            </div>

            <!-- Add more branches here -->
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
