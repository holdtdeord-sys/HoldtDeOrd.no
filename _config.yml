# Basic Site Configuration
title: HoldtDeOrd.no
description: Faktabasert oversikt over hva politikerne sa – og hva de gjorde
baseurl: ""                    # Leave empty for root domain
url: "https://holdtdeord-sys.github.io"

# Language & Timezone
lang: no
timezone: Europe/Oslo

# Build settings
markdown: kramdown
highlighter: rouge

# Theme / Plugins
theme: jekyll-theme-primer        # or whatever you're using

# Collections (for future use)
collections:
  dokumenter:
    output: true

# Default front matter
defaults:
  -
    scope:
      path: ""
    values:
      layout: default

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

# GitHub metadata
github: [metadata]
